:root{font-family:Roboto,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1b20;background:#f7f2fa;color-scheme:light}
*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;width:100%}body{min-height:100vh;background:#f7f2fa}.boot{min-height:100vh;display:grid;place-items:center;color:#49454f}
.runtime-shell{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px;background:#f7f2fa}.runtime-screen{position:relative;overflow:auto;background:#fef7ff;box-shadow:0 12px 38px rgba(29,27,32,.14);min-height:100vh;max-width:100%;transition:width .18s ease,height .18s ease}
.runtime-screen.rtl{direction:rtl;font-family:Vazirmatn,Tahoma,Arial,sans-serif}.runtime-screen.rtl *{font-family:Vazirmatn,Tahoma,Arial,sans-serif!important}.runtime-group{position:absolute;display:flex;gap:8px;align-items:flex-start}.runtime-group.column{flex-direction:column}.runtime-group.row{flex-direction:row}.runtime-item{font:inherit;color:#1d1b20}.runtime-text{display:flex;align-items:center;white-space:pre-wrap;overflow:hidden}.runtime-button{border:0;border-radius:999px;padding:0 20px;background:#6750a4;color:white;font-weight:700;cursor:pointer}.runtime-button:active{transform:scale(.98)}.runtime-input,.runtime-select,.runtime-search{border:1px solid #79747e;border-radius:12px;padding:0 14px;background:#fef7ff;color:#1d1b20;outline:none;font:inherit}.runtime-input:focus,.runtime-search:focus,.runtime-select:focus{border:2px solid #6750a4}.runtime-card,.runtime-box{border-radius:18px;background:#f3edf7;padding:16px;overflow:auto}.runtime-image{display:block;object-fit:cover;border-radius:16px;background:#ece6f0}.runtime-divider{background:#cac4d0;min-height:1px}.runtime-check{display:flex;align-items:center;gap:10px}.runtime-table{width:100%;border-collapse:collapse;font-size:14px}.runtime-table th,.runtime-table td{padding:10px 12px;border-bottom:1px solid #ddd5e3;text-align:start}.runtime-table th{font-weight:700;color:#49454f;background:#ece6f0}.runtime-list{display:flex;flex-direction:column;gap:8px}.runtime-list-row{padding:10px 12px;border:0;border-radius:12px;background:#f7f2fa;color:#1d1b20;font:inherit}.runtime-list-row strong,.runtime-list-row span{display:block}.runtime-list-row strong{font-size:15px;margin-bottom:4px}.runtime-list-row span{font-size:12px;color:#49454f;line-height:1.65}.toast{font-family:Vazirmatn,Tahoma,Arial,sans-serif;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;padding:12px 18px;border-radius:18px;background:#322f35;color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.22);font-size:14px;font-weight:600}.empty{padding:24px;color:#79747e;text-align:center}
@media(max-width:600px){.runtime-shell{padding:0}.runtime-screen{box-shadow:none;border-radius:0;min-height:100vh}}
@media(max-width:411px){.runtime-screen{width:100%!important}}

/* M3E v0.6.6 Super App professional mobile views */
.runtime-card-list{display:flex;flex-direction:column;gap:9px;overflow:auto;background:transparent!important;padding:1px!important}.runtime-work-card{padding:13px 14px;border:1px solid #bec8c8;border-radius:20px;background:#eef5f5;color:#161d1d;font:inherit;box-shadow:0 1px 2px rgba(0,0,0,.04)}.runtime-work-card strong,.runtime-work-card span{display:block}.runtime-work-card strong{font-size:14px;font-weight:800;margin-bottom:7px}.runtime-work-card span{font-size:11.5px;line-height:1.65;color:#3f4948}.runtime-detail{border:1px solid #bec8c8;border-radius:22px;background:#eef5f5;padding:14px;overflow:auto}.runtime-detail-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}.runtime-detail-head>strong{font-size:15px;font-weight:800;flex:1;direction:ltr;text-align:end}.runtime-badges{display:flex;gap:5px;flex-wrap:wrap}.runtime-badge{padding:5px 9px;border-radius:999px;background:#cce8e9;color:#051f20;font-size:10px;font-weight:750}.runtime-detail-cell{padding:9px 11px;border:1px solid #bec8c8;border-radius:14px;background:#f4fbfb;margin-top:7px}.runtime-detail-cell small{display:block;color:#3f4948;font-size:10px;margin-bottom:3px}.runtime-detail-cell span{display:block;color:#161d1d;font-size:12.5px;font-weight:650;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.runtime-empty-state{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3f4948;padding:20px}.runtime-empty-state strong{font-size:14px;color:#161d1d;margin-bottom:4px}.runtime-empty-state span{font-size:11px;line-height:1.7}

/* M3E REAL V9 — SAFE visual parity patch on top of proven V7 runtime */
:root{
  --m3-primary:#006A6A;--m3-on-primary:#FFFFFF;
  --m3-primary-container:#9CF1F6;--m3-on-primary-container:#002020;
  --m3-secondary:#4A6363;--m3-on-secondary:#FFFFFF;
  --m3-secondary-container:#CCE8E9;--m3-on-secondary-container:#051F20;
  --m3-surface:#F4FBFA;--m3-surface-low:#EFF8F7;--m3-surface-container:#E9F1F0;
  --m3-surface-high:#E3ECEB;--m3-surface-highest:#DDE6E5;
  --m3-on-surface:#161D1D;--m3-on-surface-variant:#3F4948;
  --m3-outline:#6F7979;--m3-outline-variant:#BEC8C8;
}
html,body,#app{background:var(--m3-surface)}
.runtime-shell{background:var(--m3-surface)!important;justify-content:center!important}
.runtime-screen{background:var(--m3-surface)!important;margin-left:auto!important;margin-right:auto!important}
.runtime-button.variant-filled{background:var(--m3-primary)!important;color:var(--m3-on-primary)!important;border:1px solid transparent!important}
.runtime-button.variant-tonal{background:var(--m3-secondary-container)!important;color:var(--m3-on-secondary-container)!important;border:1px solid transparent!important}
.runtime-button.variant-outlined{background:transparent!important;color:var(--m3-primary)!important;border:1px solid var(--m3-outline)!important}
.runtime-button.variant-elevated{background:var(--m3-surface-low)!important;color:var(--m3-primary)!important;box-shadow:0 2px 7px rgba(22,29,29,.13)!important;border:0!important}
.runtime-card.variant-filled{background:var(--m3-surface-highest)!important;color:var(--m3-on-surface)!important;border:0!important;box-shadow:none!important}
.runtime-card.variant-tonal{background:var(--m3-secondary-container)!important;color:var(--m3-on-secondary-container)!important;border:0!important;box-shadow:none!important}
.runtime-card.variant-elevated{background:var(--m3-surface-low)!important;color:var(--m3-on-surface)!important;border:0!important;box-shadow:0 2px 7px rgba(22,29,29,.13)!important}
.runtime-card.variant-outlined{background:var(--m3-surface)!important;color:var(--m3-on-surface)!important;border:1px solid var(--m3-outline-variant)!important;box-shadow:none!important}
.runtime-box.variant-outlined{border:1px solid var(--m3-outline-variant)!important;background:var(--m3-surface)!important}
.runtime-input,.runtime-select,.runtime-search{background:var(--m3-surface)!important;color:var(--m3-on-surface)!important;border-color:var(--m3-outline)!important}
.runtime-input:focus,.runtime-select:focus,.runtime-search:focus{border-color:var(--m3-primary)!important}
.runtime-divider{background:var(--m3-outline-variant)!important}
</style>
