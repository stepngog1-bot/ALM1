name: Build M3E V4 Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        id: android_build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee m3e-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show real build error
        if: steps.android_build.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "## REAL ANDROID BUILD ERROR" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -Ei "(^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by:|AAPT|Android resource linking failed|cannot find symbol|Could not|Exception)" m3e-build.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY" || tail -n 120 m3e-build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Prepare APK
        if: steps.android_build.outputs.exit_code == '0'
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk m3e-almas-offline-v4.apk

      - name: Create GitHub Release
        if: steps.android_build.outputs.exit_code == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: m3e-offline-v4-${{ github.run_number }}
          name: "M3E OFFLINE V4 - Build ${{ github.run_number }}"
          files: m3e-almas-offline-v4.apk
