name: Build M3E REAL V6 Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Install Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee m3e-build.log
      - name: Prepare APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk m3e-almas-real-v6.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: m3e-real-v6-${{ github.run_number }}
          name: "M3E REAL V6 - Build ${{ github.run_number }}"
          body: "نسخه REAL V6 سازگار با Android WebView قدیمی‌تر؛ Runtime اصلی پروژه حفظ شده و JavaScript به ES5 تبدیل شده است."
          files: m3e-almas-real-v6.apk
